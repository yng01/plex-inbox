[project]
name = "plex-inbox"
version = "0.1.0"
description = "Private, self-hosted Telegram bot that archives any yt-dlp-supported video, ready for Plex"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==22.8",
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
