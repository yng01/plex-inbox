# ruff — project configuration (canonical; CI enforces this exact rule set)
#
# A copy of this file also lives at `~/.config/ruff/ruff.toml` on the
# maintainer's machine as a user-global fallback for other projects — keep the
# two in sync. An explicit, curated rule selection (not "whatever the defaults
# happen to be" — stable across ruff versions) plus targeted, documented
# ignores. Rules are chosen to stay portable across projects and frameworks.

line-length = 88
target-version = "py311"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import ordering)
    "N",     # pep8-naming
    "A",     # builtin-argument-shadowing
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplicity
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security)
    "BLE",   # flake8-blind-except
    "FURB",  # refurb (idiomatic rewrites)
    "FLY",   # flake8-f-strings
    "ISC",   # flake8-implicit-str-concat
    "PYI",   # pyi-specific (mild subset)
]

ignore = [
    # Broad `except Exception` is a deliberate pattern: one bad item must never
    # take down the whole queue (see AGENTS.md: "never crash on one bad item").
    "BLE001",
    # `assert` is used in tests and for internal invariants.
    "S101",
    # Bandit false positive: config-dict kwargs (e.g. PLEX_TOKEN), not credentials.
    "S106",
    # Best-effort try/except/pass in cleanup paths where logging adds no value.
    "S110",
    # Only NFO sidecar XML generated by the bot itself is parsed.
    "S314",
    # The product UI intentionally uses emoji / Arabic punctuation.
    "RUF001",
]

[lint.per-file-ignores]
# Translation catalog: EN/AR strings must not be reflowed, long lines are expected.
"bot/i18n.py" = ["E501"]
# Test helpers unpack fixture tuples and mirror Telegram's `id` field name.
"tests/**" = ["RUF059", "RUF012", "A002"]
